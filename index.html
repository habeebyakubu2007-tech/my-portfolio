<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: linear-gradient(to right, #e0eafc, #cfdef3);
            text-align: center;
        }

        .container {
            padding: 60px 20px;
        }

        h1 {
            font-size: 40px;
            color: #222;
        }

        p {
            font-size: 18px;
            color: #444;
        }

        .card {
            background: white;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-top: 20px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="https://via.placeholder.com/120" alt="profile">

        <h1>Hi, I'm [Habeeb Yakubu] 👋</h1>
        <p>Beginner Web Developer</p>

        <div class="card">
            <h2>Skills</h2>
            <p>HTML • CSS • JavaScript (learning)</p>
        </div>

        <div class="card">
            <h2>About Me</h2>
            <p>I am 19 years old and learning to build real websites step by step.</p>
        </div>

        <button onclick="alert('Thanks for visiting! 🚀')">
            Contact Me
        </button>

    </div>

</body>
</html>
